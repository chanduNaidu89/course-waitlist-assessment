# The single offering this service manages.
waitlist.offering-code=CS201
waitlist.capacity=2
waitlist.prerequisites=CS101

# Seed learner records: learner id -> completed course codes.
# Use the [bracket] form: without it Spring drops characters such as '@' and '/' from map keys (jo@x.edu -> jox.edu).
# alice, bob, carol, dave are eligible (completed CS101); erin is a known learner who is not.
waitlist.learners[alice]=CS101
waitlist.learners[bob]=CS101,MATH100
waitlist.learners[carol]=CS101
waitlist.learners[dave]=CS101
waitlist.learners[erin]=MATH100
